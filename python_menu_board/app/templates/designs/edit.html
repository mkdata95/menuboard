{% extends 'base.html' %}

{% block title %}디자인 수정 - {{ design.name }}{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/design-editor.css') }}">
<style>
    body {
        overflow: hidden;
        margin: 0;
        padding: 0;
        height: 100vh;
    }
    .container {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }
    footer {
        display: none;
    }
    .design-editor-container {
        height: calc(100vh - 50px);
        overflow: hidden;
        margin: 0;
        padding: 0;
    }
    .design-editor-header {
        height: 50px;
        z-index: 1000;
        background-color: #fff;
        border-bottom: 1px solid #e0e0e0;
    }
    .canvas-container {
        position: relative;
        height: 100% !important;
        width: 100% !important;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
    }
    /* 속성 패널 스타일 개선 */
    .properties-panel {
        height: 100%;
        overflow-y: auto;
        border-left: 1px solid #e0e0e0;
        background-color: #f9f9f9;
        padding: 15px;
    }
    .property-section {
        margin-bottom: 15px;
    }
    .property-section.d-none {
        display: none !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="design-editor-page">
    <div class="design-editor-header d-flex justify-content-between align-items-center">
        <h1 class="h3">{{ design.name }}</h1>
        <div class="d-flex align-items-center">
            <button id="save-design" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#save-design-modal">
                <i class="fas fa-save"></i> 저장
            </button>
            <a href="{{ url_for('design.index') }}" class="btn btn-outline-secondary ms-2">
                <i class="fas fa-times"></i>
            </a>
        </div>
    </div>

    <div class="row design-editor-container">
        <!-- 좌측 툴바 -->
        <div class="col-md-1 p-0">
            <div class="editor-toolbar">
                <div class="toolbar-section">
                    <button class="toolbar-btn" id="add-text" title="텍스트 추가">
                        <i class="fas fa-font"></i>
                    </button>
                    <button class="toolbar-btn" id="add-image" title="이미지 추가">
                        <i class="fas fa-image"></i>
                    </button>
                    <button class="toolbar-btn" id="add-shape" title="도형 추가">
                        <i class="fas fa-shapes"></i>
                    </button>
                    <button class="toolbar-btn" id="add-background" title="배경 이미지 추가">
                        <i class="fas fa-image"></i>
                    </button>
                    <button class="toolbar-btn" id="add-menu-table" title="메뉴 테이블 추가">
                        <i class="fas fa-table"></i>
                    </button>
                </div>
                <div class="toolbar-section">
                    <button class="toolbar-btn" id="delete-object" title="선택 객체 삭제">
                        <i class="fas fa-trash"></i>
                    </button>
                    <button class="toolbar-btn" id="undo" title="실행 취소">
                        <i class="fas fa-undo"></i>
                    </button>
                    <button class="toolbar-btn" id="redo" title="다시 실행">
                        <i class="fas fa-redo"></i>
                    </button>
                </div>
                <div class="toolbar-section">
                    <button class="toolbar-btn" id="bring-front" title="맨 앞으로 가져오기">
                        <i class="fas fa-level-up-alt"></i>
                    </button>
                    <button class="toolbar-btn" id="send-back" title="맨 뒤로 보내기">
                        <i class="fas fa-level-down-alt"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 캔버스 영역 -->
        <div class="col p-0">
            <div class="canvas-container">
                <canvas id="design-canvas"></canvas>
            </div>
        </div>

        <!-- 오른쪽 속성 패널 -->
        <div class="col-md-3 p-0">
            <div class="properties-panel">
                <h5 class="panel-title">속성</h5>
                
                <!-- 일반 속성 (투명도, 회전 속성 제거) -->
                <div id="general-properties" class="property-section">
                    <div class="form-group mb-3">
                        <label for="canvas-width">캔버스 너비 (px)</label>
                        <input type="number" id="canvas-width" class="form-control" value="1200" min="100" max="3000">
                    </div>
                    <div class="form-group mb-3">
                        <label for="canvas-height">캔버스 높이 (px)</label>
                        <input type="number" id="canvas-height" class="form-control" value="800" min="100" max="2000">
                    </div>
                    <div class="form-group mb-3">
                        <label for="canvas-background">배경 색상</label>
                        <input type="color" id="canvas-background" class="form-control" value="#ffffff">
                    </div>
                </div>

                <!-- 텍스트 속성 -->
                <div id="text-properties" class="property-section d-none">
                    <div class="form-group mb-3">
                        <label for="text-content">텍스트 내용</label>
                        <textarea id="text-content" class="form-control"></textarea>
                    </div>
                    <div class="form-group mb-3">
                        <label for="text-font-family">글꼴</label>
                        <select id="text-font-family" class="form-select">
                            <option value="Arial">Arial</option>
                            <option value="Helvetica">Helvetica</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Verdana">Verdana</option>
                            <option value="Georgia">Georgia</option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label for="text-font-size">글자 크기</label>
                        <input type="number" id="text-font-size" class="form-control" value="20" min="6" max="200">
                    </div>
                    <div class="form-group mb-3">
                        <label for="text-color">글자 색상</label>
                        <input type="color" id="text-color" class="form-control" value="#000000">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="text-bold">
                        <label class="form-check-label" for="text-bold">굵게</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="text-italic">
                        <label class="form-check-label" for="text-italic">기울임</label>
                    </div>
                    <div class="form-group mb-3">
                        <label for="text-align">텍스트 정렬</label>
                        <select id="text-align" class="form-select">
                            <option value="left">왼쪽</option>
                            <option value="center">가운데</option>
                            <option value="right">오른쪽</option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label for="text-opacity">투명도</label>
                        <input type="range" id="text-opacity" class="form-range" min="0" max="1" step="0.1" value="1">
                    </div>
                    <div class="form-group mb-3">
                        <label for="text-angle">회전 각도</label>
                        <input type="range" id="text-angle" class="form-range" min="0" max="360" step="1" value="0">
                        <output id="text-angle-value">0°</output>
                    </div>
                </div>

                <!-- 이미지 속성 -->
                <div id="image-properties" class="property-section d-none">
                    <div class="form-group mb-3">
                        <label for="image-opacity">투명도</label>
                        <input type="range" id="image-opacity" class="form-range" min="0" max="1" step="0.1" value="1">
                    </div>
                    <div class="form-group mb-3">
                        <label>이미지 변경</label>
                        <input type="file" id="replace-image" class="form-control" accept="image/*">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="image-lock">
                        <label class="form-check-label" for="image-lock">잠금</label>
                    </div>
                </div>

                <!-- 도형 속성 -->
                <div id="shape-properties" class="property-section d-none">
                    <div class="form-group mb-3">
                        <label for="shape-fill">채우기 색상</label>
                        <input type="color" id="shape-fill" class="form-control" value="#4CAF50">
                    </div>
                    <div class="form-group mb-3">
                        <label for="shape-stroke">테두리 색상</label>
                        <input type="color" id="shape-stroke" class="form-control" value="#000000">
                    </div>
                    <div class="form-group mb-3">
                        <label for="shape-stroke-width">테두리 두께</label>
                        <input type="number" id="shape-stroke-width" class="form-control" value="1" min="0" max="20">
                    </div>
                    <div class="form-group mb-3">
                        <label for="shape-opacity">투명도</label>
                        <input type="range" id="shape-opacity" class="form-range" min="0" max="1" step="0.1" value="1">
                    </div>
                </div>

                <!-- 메뉴 테이블 속성 -->
                <div id="menu-table-properties" class="property-section d-none">
                    <div class="mb-3">
                        <h6 class="fw-bold">메뉴 테이블 설정</h6>
                        <!-- 행 추가 버튼 -->
                        <div class="form-group mb-3">
                            <button id="add-table-row" class="btn btn-primary w-100">
                                <i class="fas fa-plus"></i> 메뉴 행 추가
                            </button>
                        </div>
                        
                        <hr>
                        
                        <!-- 텍스트 설정 -->
                        <div class="form-group mb-2">
                            <label for="table-font-size">폰트 크기</label>
                            <input type="number" id="table-font-size" class="form-control" value="24" min="12" max="72">
                        </div>
                        
                        <div class="form-group mb-2">
                            <label for="table-text-color">텍스트 색상</label>
                            <input type="color" id="table-text-color" class="form-control" value="#000000">
                        </div>
                        
                        <hr>
                        
                        <!-- 테이블 스타일 -->
                        <div class="form-group mb-2">
                            <label for="table-background-color">배경 색상</label>
                            <input type="color" id="table-background-color" class="form-control" value="#ffffff">
                        </div>
                        
                        <div class="form-group mb-2">
                            <label for="table-border-color">테두리 색상</label>
                            <input type="color" id="table-border-color" class="form-control" value="#000000">
                        </div>
                        
                        <div class="form-group mb-2">
                            <label for="table-border-width">테두리 두께</label>
                            <input type="number" id="table-border-width" class="form-control" value="2" min="0" max="10">
                        </div>
                        
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="table-hide-border">
                            <label class="form-check-label" for="table-hide-border">테두리 감추기</label>
                        </div>
                        
                        <div class="form-group mb-2">
                            <label for="table-width">테이블 너비</label>
                            <input type="number" id="table-width" class="form-control" value="600" min="300" max="1500">
                        </div>
                        
                        <button id="apply-table-changes" class="btn btn-primary w-100 mt-3">테이블 스타일 적용</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 파일 입력 숨김 -->
<input type="file" id="image-upload" accept="image/*" style="display: none;">
<input type="file" id="background-upload" accept="image/*" style="display: none;">

<!-- 도형 메뉴 모달 -->
<div class="modal fade" id="shape-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">도형 선택</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="shape-picker">
                    <div class="shape-item" data-shape="rect">
                        <div class="shape-preview rect"></div>
                        <div class="shape-name">사각형</div>
                    </div>
                    <div class="shape-item" data-shape="circle">
                        <div class="shape-preview circle"></div>
                        <div class="shape-name">원</div>
                    </div>
                    <div class="shape-item" data-shape="triangle">
                        <div class="shape-preview triangle"></div>
                        <div class="shape-name">삼각형</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 디자인 저장 모달 추가 -->
<div class="modal fade" id="save-design-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">디자인 저장</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="form-group mb-3">
                    <label for="design-name-input">디자인 이름</label>
                    <input type="text" class="form-control" id="design-name-input" value="{{ design.name }}" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" id="confirm-save-design">저장</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="{{ url_for('static', filename='js/design-editor.js') }}?v={{ range(1000, 9999) | random }}"></script>
{% endblock %}
